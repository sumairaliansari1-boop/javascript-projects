<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>API Version Shopping Cart Manager</title>
    <link rel="stylesheet" href="shoopingcart.css" />
  </head>

  <body>
    <div class="header">
      <h1>Shopping Cart</h1>
    <button class="dark">Dark Mode</button>
       </div>
    <p id="productMsg">Loading products...</p>
    <div id="products"></div>

    <hr />

    <h2>Cart</h2>

    <div id="cart">
      <p id="empty-cart">Your cart is empty 🛒</p>
    </div>

    <h3>Total: USD <span id="total">0</span></h3>

    <button id="clear-cart">Clear Cart</button>



    <script src="shoppingCart.js"></script>
  </body>
</html>
