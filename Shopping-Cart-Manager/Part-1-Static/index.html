<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Shopping Cart Manager</title>
    <link rel="stylesheet" href="shoopingcart.css">
  </head>

  <body>
    <h1>Shopping Cart</h1>
    <button class="dark">Dark Mode</button>
    <div id="products">
      <div class="product">
        <h3>Wireless Headphones</h3>
        <p>Price: Rs. 8,500</p>
        <button class="add-cart">Add to Cart</button>
      </div>

      <div class="product">
        <h3>Mechanical Keyboard</h3>
        <p>Price: Rs. 6,000</p>
        <button class="add-cart">Add to Cart</button>
      </div>

      <div class="product">
        <h3>Gaming Mouse</h3>
        <p>Price: Rs. 3,500</p>
        <button class="add-cart">Add to Cart</button>
      </div>

      <div class="product">
        <h3>USB-C Charger</h3>
        <p>Price: Rs. 4,000</p>
        <button class="add-cart">Add to Cart</button>
      </div>

      <div class="product">
        <h3>Laptop Stand</h3>
        <p>Price: Rs. 5,500</p>
        <button class="add-cart">Add to Cart</button>
      </div>
    </div>

    <hr />

    <h2>Cart</h2>

    <div id="cart">
      <p id="empty-cart">Your cart is empty 🛒 </p>
    </div>

    <h3>Total: Rs. <span id="total">0</span></h3>

    <button id="clear-cart">Clear Cart</button>

  <script src="script.js"></script>
  </body>
</html>
